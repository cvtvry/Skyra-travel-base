<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skýra Travels</title>

    <!-- TIPOGRAFÍA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:'Inter', sans-serif;
            background:#0d1110;
            color:white;
            overflow-x:hidden;
        }

        /* FONDO */

        body::before{
            content:"";
            position:fixed;
            inset:0;

            background:
            linear-gradient(rgba(5,10,10,.70), rgba(5,10,10,.75)),
            url('https://images.unsplash.com/photo-1516483638261-f4dbaf036963?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            z-index:-2;
        }

        /* NAVBAR */

        nav{
            width:100%;
            padding:25px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;

            position:fixed;
            top:0;
            left:0;

            backdrop-filter:blur(8px);
            background:rgba(0,0,0,.25);

            z-index:999;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .logo img{
            width:55px;
            height:55px;
            object-fit:contain;
        }

        .logo h1{
            font-family:'Cinzel', serif;
            font-size:1.8rem;
            letter-spacing:2px;
        }

        .menu{
            display:flex;
            gap:35px;
        }

        .menu a{
            text-decoration:none;
            color:white;
            font-size:.95rem;
            transition:.3s;
        }

        .menu a:hover{
            color:#9bb89b;
        }

        /* HERO */

        .hero{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;

            padding:120px 10%;
        }

        .hero-content{
            max-width:900px;
        }

        .hero h2{
            font-family:'Cinzel', serif;
            font-size:5rem;
            margin-bottom:20px;
            letter-spacing:3px;
        }

        .hero p{
            font-size:1.3rem;
            color:#d6d6d6;
            line-height:1.7;
            margin-bottom:40px;
        }

        .hero button{
            padding:18px 45px;
            border:none;
            border-radius:50px;

            background:#708d74;
            color:white;

            font-size:1rem;
            cursor:pointer;

            transition:.3s;
        }

        .hero button:hover{
            transform:scale(1.05);
            background:#89a88d;
        }

        /* LOADER */

        #loader{
            position:fixed;
            inset:0;

            background:#0d1110;

            display:flex;
            justify-content:center;
            align-items:center;

            z-index:9999;

            transition:1s;
        }

        .dragon-loader{
            width:90px;
            height:90px;
            border:5px solid rgba(255,255,255,.15);
            border-top:5px solid #9bb89b;
            border-radius:50%;

            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }

        /* RESPONSIVE */

        @media(max-width:900px){

            .hero h2{
                font-size:3rem;
            }

            nav{
                flex-direction:column;
                gap:15px;
            }

            .menu{
                gap:18px;
                flex-wrap:wrap;
                justify-content:center;
            }

        }

    </style>
</head>

<body>

    <!-- LOADER -->

    <div id="loader">
        <div class="dragon-loader"></div>
    </div>

    <!-- NAV -->

    <nav>

        <div class="logo">

            <!-- CAMBIA skyra-logo.png POR TU LOGO -->

            <img src="skyra-logo.png" alt="logo">

            <h1>Skýra Travels</h1>

        </div>

        <div class="menu">

            <a href="#">Inicio</a>
            <a href="#">Destinos</a>
            <a href="#">Experiencias</a>
            <a href="#">Reservas</a>
            <a href="#">Contacto</a>

        </div>

    </nav>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <h2>Live the Legend</h2>

            <p>
                Explora Noruega, Irlanda, Escocia,
                Inglaterra y Dinamarca en experiencias
                inspiradas en leyendas, dragones y
                paisajes del norte europeo.
            </p>

            <button>
                Reservar Ahora
            </button>

        </div>

    </section>

    <script>

        window.addEventListener("load", () => {

            const loader = document.getElementById("loader");

            loader.style.opacity = "0";

            setTimeout(() => {
                loader.style.display = "none";
            },1000);

        });

    </script>

</body>
</html>
